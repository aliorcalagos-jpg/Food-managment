<title>Meal Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a kitchen notepad. A sticky header holds the name and three tabs;
   every list is a ruled row, and only the day blocks and the generator form are carded. */
:root {
  --bg: #f2f5f3;
  --surface: #ffffff;
  --ink: #15201b;
  --muted: #566860;
  --line: #d6dfd9;
  --accent: #17695a;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --danger: #b3261e;
  --danger-soft: #fbe4e1;
  --warn: #b7791f;
  --bar-dim: #5aa08e;
  --note: #fbf0cd;
  --note-ink: #5a4300;
  --focus: #0b57d0;
  --font-body: "Instrument Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans Arabic", "Instrument Sans", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #171e1a; --ink: #e7eee9; --muted: #98a9a0; --line: #2a352f;
    --accent: #5cc4a1; --accent-ink: #06231a; --accent-soft: #1d3029;
    --danger: #ff8a80; --danger-soft: #3a1c19; --warn: #e0b24a; --bar-dim: #3b7f6a; --note: #3a3012; --note-ink: #f1d88a; --focus: #8ab4f8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #171e1a; --ink: #e7eee9; --muted: #98a9a0; --line: #2a352f;
  --accent: #5cc4a1; --accent-ink: #06231a; --accent-soft: #1d3029;
  --danger: #ff8a80; --danger-soft: #3a1c19; --warn: #e0b24a; --bar-dim: #3b7f6a; --note: #3a3012; --note-ink: #f1d88a; --focus: #8ab4f8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.05rem; margin-top: 20px; }
h4 { font-size: .8125rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.arrow { display: inline-block; }
[dir="rtl"] .arrow { transform: scaleX(-1); }
/* Arabic joins letters, so letter-spacing and forced capitals would break the words */
[dir="rtl"] h4, [dir="rtl"] .aisle-title { letter-spacing: 0; text-transform: none; }
.stack > .link { align-self: flex-start; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

.app { max-width: 760px; margin: 0 auto; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding: 14px 0 0; border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 1.25rem; font-weight: 700; }
.lang-switch { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; min-height: 36px; color: var(--ink); }
.lang-switch:hover { border-color: var(--accent); color: var(--accent); }
.tabs { display: flex; gap: 4px; margin-top: 10px; }
.tab {
  appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
  padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; min-height: 44px;
}
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.main { padding-top: 22px; }

.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 14px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }

input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; min-height: 44px;
}
textarea { resize: vertical; }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); flex: none; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, legend { font-size: .875rem; font-weight: 600; }
.field-error { color: var(--danger); font-size: .875rem; }
[aria-invalid="true"] { border-color: var(--danger); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.search { margin-bottom: 12px; }

.btn {
  font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px; min-height: 44px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .6; cursor: default; }
.link { appearance: none; background: none; border: 0; padding: 6px 2px; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; min-height: 32px; }
.link.danger { color: var(--danger); }
.icon-btn { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; width: 44px; min-height: 44px; cursor: pointer; border-radius: 8px; }
.icon-btn:hover:not(:disabled) { color: var(--danger); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
.chip { font: inherit; font-size: .875rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill { display: inline-block; margin-inline-start: 10px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 600 .75rem var(--font-body); vertical-align: middle; }

.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rows > li { border-bottom: 1px solid var(--line); }
.row-btn { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 16px; width: 100%; text-align: start; background: none; border: 0; padding: 14px 2px; font: inherit; color: inherit; cursor: pointer; min-height: 44px; }
.row-btn:hover .row-title { color: var(--accent); }
.row-title { font-weight: 600; }
.ingredients { margin: 8px 0 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.prose { white-space: pre-wrap; max-width: 65ch; margin-top: 8px; }

.ing-row { display: grid; grid-template-columns: 4.5rem 5.5rem minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.empty-inline { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 8px; }
.empty { padding: 28px 0; display: flex; flex-direction: column; gap: 6px; }
.empty-title { font: 600 1.1rem var(--font-display); }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--note); color: var(--note-ink); padding: 10px 14px; border-radius: var(--radius); margin: 14px 0 0; }
.banner .link { color: inherit; }
.banner.error { background: var(--danger-soft); color: var(--danger); }
.main .banner { margin: 0 0 14px; }

.weeknav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.week-range { font-weight: 600; }
.week-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
@media (min-width: 860px) { .week-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 22rem); } .buy { position: sticky; top: 12px; } }
.food { display: flex; flex-direction: column; }
.food-btn { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 10px 4px; text-align: start; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; }
.food-btn:hover .row-title { color: var(--accent); }
.food-mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 2px solid var(--line); border-radius: 8px; font-weight: 700; color: var(--accent-ink, #fff); }
.food.on .food-mark { background: var(--accent); border-color: var(--accent); }
.food.on { background: var(--accent-soft); }
.food-note { margin: 0 0 10px 0; padding-inline-start: 46px; }
.food-servings { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 0 4px 12px; padding-inline-start: 46px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper .icon-btn { min-width: 44px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 1.25rem; }
.stepper .icon-btn:disabled { opacity: .4; cursor: default; }
.stepper-n { min-width: 2.25rem; text-align: center; font-weight: 700; font-size: 1.125rem; }
.buy-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.buy-head h3 { margin: 0; }
.buy-item { padding: 8px 2px; }
.buy .banner { margin: 0; }
.hint { margin: 4px 0 0; font-size: .875rem; }
.inline-form, .add-item { display: grid; grid-template-columns: 4.5rem 5.5rem minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.inline-form { grid-template-columns: minmax(0, 1fr) auto; }
.aisle { margin-top: 6px; }
.aisle-title { margin: 14px 0 4px; font: 600 .8125rem var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rows.tight > li.item { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.check { display: flex; align-items: center; gap: 12px; padding: 10px 2px; flex: 1; cursor: pointer; min-width: 0; }
.done { color: var(--muted); text-decoration: line-through; }

/* ---- Expenses ---- */
.hero-card .hero { font: 600 clamp(2.25rem, 9vw, 3rem)/1.1 var(--font-body); font-variant-numeric: normal; margin: 4px 0 2px; }
.other-money { font-size: .875rem; }
.meter { height: 12px; border-radius: 999px; background: var(--line); display: flex; overflow: hidden; margin: 14px 0 10px; }
.meter-fill { height: 100%; background: var(--accent); }
.meter-fill.warn { background: var(--warn); }
.meter-fill.over { background: var(--danger); }
/* planned-but-not-bought: hatched, so it is told apart by pattern and not only by colour */
.meter-plan { height: 100%; background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 6px); opacity: .35; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.status-icon { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font: 700 .8125rem var(--font-body); flex: none; }
.status.ok .status-icon { background: var(--accent-soft); color: var(--accent); }
.status.warn .status-icon { background: var(--note); color: var(--note-ink); }
.status.over .status-icon { background: var(--danger-soft); color: var(--danger); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 10px 16px; margin: 14px 0 0; }
.facts dt { font-size: .8125rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }

.chart > h3 { margin: 6px 0 8px; }
.bars { list-style: none; margin: 0; padding: 0; }
.bar-row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; }
.bar-label { font-size: .9375rem; }
.bar-track { height: 16px; display: flex; }
.bar-fill { height: 100%; min-width: 2px; background: var(--accent); border-start-end-radius: 4px; border-end-end-radius: 4px; }
.bar-value { font-weight: 600; font-size: .9375rem; }

.history { --plot-h: 140px; --label-h: 30px; --value-h: 22px; position: relative; display: flex; gap: 6px; }
.col { flex: 1 1 0; min-width: 0; display: grid; grid-template-rows: var(--value-h) var(--plot-h) var(--label-h); justify-items: center; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; }
.col-value { font-size: .75rem; font-weight: 600; align-self: end; }
/* the baseline is a shadow, not a border: a border would shave 1px off the plot and put bars on a different scale than the budget line */
.col-plot { width: 100%; display: flex; align-items: flex-end; justify-content: center; box-shadow: 0 1px 0 var(--line); }
.col-bar { width: min(100%, 24px); background: var(--bar-dim); border-radius: 4px 4px 0 0; }
.col-bar.selected { background: var(--accent); }
.col-label { font-size: .75rem; color: var(--muted); text-align: center; align-self: center; }
.col[aria-pressed="true"] .col-label { color: var(--ink); font-weight: 600; }
.axis-max { position: absolute; inset-inline-start: 0; top: 0; font-size: .75rem; color: var(--muted); }
.budget-line { position: absolute; inset-inline: 0; bottom: calc(var(--label-h) + var(--plot-h) * var(--budget)); border-top: 2px solid var(--ink); pointer-events: none; }
.budget-tag { position: absolute; inset-inline-start: 0; bottom: 3px; font-size: .75rem; color: var(--muted); background: var(--bg); padding-inline: 4px; }
.numbers { margin-top: 8px; }
.numbers summary { cursor: pointer; color: var(--accent); }
.numbers table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .9375rem; }
.numbers th, .numbers td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); font-weight: 400; }
.numbers thead th { font-size: .8125rem; color: var(--muted); }

.settings summary { cursor: pointer; }
.settings .stack { margin-top: 12px; }
.segmented { display: flex; flex-wrap: wrap; gap: 8px; }
.field > .label { font-size: .875rem; font-weight: 600; }
.small { font-size: .8125rem; }

.trip-meta { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 20px; }
.trip-meta .field { min-width: 11rem; }
.totals { margin: 0; padding-block-end: 8px; }
.price { flex: none; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding-inline-start: 10px; }
.price:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.price-symbol { color: var(--muted); }
.price-input { width: 5.5rem; border: 0; background: transparent; text-align: end; }
.price-input:focus-visible { outline: none; }
.price-input[aria-invalid="true"] { color: var(--danger); }
.price:has(.price-input[aria-invalid="true"]) { border-color: var(--danger); }
.status-note { margin: 4px 0 0; padding-inline-start: 30px; color: var(--note-ink); }
.col-label { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.col-label small { font-size: .6875rem; }

@media (max-width: 520px) {
  .two { grid-template-columns: minmax(0, 1fr); }
  .ing-row, .add-item { grid-template-columns: 4rem 4.5rem minmax(0, 1fr) auto; gap: 6px; }
  .bar-row { grid-template-columns: 5rem minmax(0, 1fr) auto; gap: 8px; }
  .price-input { width: 4.75rem; }
  .week-range { flex-basis: 100%; order: -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .tab { transition: background-color .12s, border-color .12s, color .12s; }
}
</style>
<div id="root">
  <div class="app"><header class="top"><h1 class="brand">Meal Planner</h1></header><main class="main"><p class="muted">Loading your kitchen…</p></main></div>
</div>
