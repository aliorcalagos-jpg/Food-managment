<title>Meal Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first. A slim header, one screen at a time, a bottom navigation bar, and a sticky action bar
   where the job has one main action (start shopping, save, the shop total). Foods are cards, lists are big rows. */
:root {
  --bg: #f1f4f2;
  --surface: #ffffff;
  --surface-2: #e9eeeb;
  --ink: #14201a;
  --muted: #53665d;
  --line: #d3ddd7;
  --accent: #0d6a54;
  --accent-strong: #095241;
  --accent-ink: #ffffff;
  --accent-soft: #d8eee5;
  --saffron: #e9a820;
  --saffron-soft: #fbefcf;
  --danger: #b3261e;
  --danger-soft: #fbe4e1;
  --warn: #b7791f;
  --bar-dim: #5aa08e;
  --note: #fbf0cd;
  --note-ink: #5a4300;
  --focus: #0b57d0;
  --shadow: 0 1px 2px rgba(20, 32, 26, .06), 0 6px 20px rgba(20, 32, 26, .07);
  --shadow-up: 0 -2px 12px rgba(20, 32, 26, .10);
  --font-body: "Instrument Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans Arabic", "Instrument Sans", system-ui, sans-serif;
  --radius: 18px;
  --radius-sm: 12px;
  --nav-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #172019; --surface-2: #202b24; --ink: #e8efea; --muted: #9aaba2; --line: #2b372f;
    --accent: #5cc4a1; --accent-strong: #7fd6b9; --accent-ink: #06231a; --accent-soft: #1b3228;
    --saffron: #f0b73a; --saffron-soft: #3a3012;
    --danger: #ff8a80; --danger-soft: #3a1c19; --warn: #e0b24a; --bar-dim: #3b7f6a; --note: #3a3012; --note-ink: #f1d88a; --focus: #8ab4f8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35); --shadow-up: 0 -2px 14px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #172019; --surface-2: #202b24; --ink: #e8efea; --muted: #9aaba2; --line: #2b372f;
  --accent: #5cc4a1; --accent-strong: #7fd6b9; --accent-ink: #06231a; --accent-soft: #1b3228;
  --saffron: #f0b73a; --saffron-soft: #3a3012;
  --danger: #ff8a80; --danger-soft: #3a1c19; --warn: #e0b24a; --bar-dim: #3b7f6a; --note: #3a3012; --note-ink: #f1d88a; --focus: #8ab4f8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35); --shadow-up: 0 -2px 14px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
  -webkit-tap-highlight-color: transparent;
}
[dir="rtl"] body, body[dir="rtl"], [dir="rtl"] { line-height: 1.65; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 1.625rem; }
h3 { font-size: 1.125rem; }
h4 { font-size: .875rem; font-weight: 600; color: var(--muted); font-family: var(--font-body); margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.arrow { display: inline-block; }
[dir="rtl"] .arrow { transform: scaleX(-1); }
.stack > .link, .stack > .back { align-self: flex-start; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
svg.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---- shell ---- */
.app { max-width: 960px; margin: 0 auto; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 1.25rem; font-weight: 700; }
.lang-switch { appearance: none; background: var(--surface); font: inherit; font-size: .9375rem; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; min-height: 44px; color: var(--ink); cursor: pointer; }
.lang-switch:hover { border-color: var(--accent); color: var(--accent); }
.main { padding-top: 8px; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 104px); }
.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: var(--surface); box-shadow: var(--shadow-up);
  border-top: 1px solid var(--line); padding-bottom: var(--safe-b);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.bottom-nav-in { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.nav-btn { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: .8125rem; font-weight: 600; min-height: var(--nav-h); padding: 8px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.nav-ico { display: grid; place-items: center; width: 56px; height: 32px; border-radius: 999px; }
.nav-btn[aria-current="page"] { color: var(--accent-strong); }
.nav-btn[aria-current="page"] .nav-ico { background: var(--accent-soft); }
body:has(.focus-bar) .bottom-nav { display: none; }
body:has(.focus-bar) .main { padding-bottom: 120px; }

.sticky-bar { position: fixed; inset-inline: 0; bottom: calc(var(--nav-h) + var(--safe-b)); z-index: 9; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.sticky-in { max-width: 960px; margin: 0 auto 10px; pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 10px 10px 16px; padding-inline: 16px 10px; display: flex; align-items: center; gap: 12px; }
.bar-summary { flex: 1; min-width: 0; text-align: start; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 4px 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
.bar-summary strong { font-size: 1.0625rem; }
.bar-summary span { font-size: .875rem; color: var(--muted); }
.focus-bar { position: fixed; inset-inline: 0; bottom: 0; z-index: 12; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow-up); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + var(--safe-b)); }
.focus-bar-in { max-width: 960px; margin: 0 auto; display: flex; gap: 10px; }
.focus-bar-in .btn { flex: 1; }
.focus-bar-in .btn.primary { flex: 2; }

.sheet-overlay { position: fixed; inset: 0; z-index: 30; background: rgba(8, 14, 11, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 92dvh; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 24px 24px 0 0; padding: 18px 20px calc(20px + var(--safe-b)); display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-up); }
@media (min-width: 700px) { .sheet-overlay { align-items: center; } .sheet { border-radius: 24px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-close { appearance: none; background: var(--surface-2); border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 1.125rem; color: var(--ink); cursor: pointer; flex: none; }

/* ---- shared controls ---- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 12px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }

input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--radius-sm); padding: 12px 14px; width: 100%; min-width: 0; min-height: 52px;
}
textarea { resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, legend { font-size: .9375rem; font-weight: 600; }
.field-error { color: var(--danger); font-size: .9375rem; }
[aria-invalid="true"] { border-color: var(--danger); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.search { margin-bottom: 14px; }
.hint { font-size: .9375rem; }

.btn {
  font: inherit; font-weight: 600; border-radius: 14px; padding: 12px 20px; min-height: 52px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: none; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.link { appearance: none; background: none; border: 0; padding: 8px 4px; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; min-height: 44px; }
.link.danger { color: var(--danger); }
.back { appearance: none; border: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 44px; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.icon-btn { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; width: 44px; min-height: 44px; cursor: pointer; border-radius: 12px; flex: none; }
.icon-btn:hover:not(:disabled) { color: var(--danger); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: .9375rem; font-weight: 500; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip-row .chip { flex: none; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--saffron-soft); color: var(--note-ink); font: 600 .8125rem var(--font-body); vertical-align: middle; }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--note); color: var(--note-ink); padding: 12px 16px; border-radius: var(--radius-sm); }
.banner .link { color: inherit; }
.banner.error { background: var(--danger-soft); color: var(--danger); }
.main .banner { margin: 0 0 14px; }
.empty { padding: 36px 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.empty-title { font: 700 1.25rem var(--font-display); }
.empty-inline { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 8px; }

.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 4px; }
.stepper .icon-btn { width: 48px; min-height: 48px; border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 1.5rem; line-height: 1; box-shadow: 0 1px 2px rgba(20, 32, 26, .12); }
.stepper .icon-btn:hover:not(:disabled) { color: var(--accent); }
.stepper-n { min-width: 2.75rem; text-align: center; font-weight: 700; font-size: 1.25rem; }

/* ---- This week ---- */
.week-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 18px; }
.week-btn { appearance: none; border: 0; background: var(--surface-2); color: var(--ink); width: 48px; height: 48px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; font: inherit; flex: none; }
.week-mid { display: flex; flex-direction: column; align-items: center; min-width: 0; text-align: center; }
.week-range { font-weight: 700; }
.week-now { appearance: none; background: none; border: 0; font: inherit; font-size: .875rem; color: var(--accent); cursor: pointer; padding: 0 8px; min-height: 24px; text-decoration: underline; }
.week-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 900px) { .week-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 24rem); } .buy { position: sticky; top: 76px; } }
.picks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 12px; }
.pick { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; box-shadow: var(--shadow); }
.pick.on { border-color: var(--accent); background: var(--accent-soft); }
.pick-btn { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; font-size: 1.0625rem; color: inherit; text-align: start; cursor: pointer; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; align-items: center; }
.pick-btn bdi { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pick-check { flex: none; width: 28px; height: 28px; border-radius: 999px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-weight: 700; font-size: .9375rem; background: var(--surface); }
.pick.on .pick-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.pick-foot .muted { font-size: .875rem; }
.pick-note { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.pick-note .link { padding: 4px 0; min-height: 44px; font-size: .9375rem; }
.buy { display: flex; flex-direction: column; gap: 14px; }
.buy-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.buy-head h3 { margin: 0; font-size: 1.25rem; }
.buy-item { padding: 12px 2px; font-size: 1.0625rem; }
.buy .banner { margin: 0; }
.aisle { margin-top: 4px; }
.aisle-title { margin: 12px 0 4px; font: 700 .9375rem var(--font-body); color: var(--accent-strong); }

.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rows > li { border-bottom: 1px solid var(--line); }
.row-title { font-weight: 600; }

/* ---- Foods ---- */
.food-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 12px; }
.food-card { appearance: none; width: 100%; text-align: start; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; font: inherit; color: inherit; cursor: pointer; box-shadow: var(--shadow); }
.food-card:hover { border-color: var(--accent); }
.food-card-title { font-weight: 600; font-size: 1.0625rem; overflow-wrap: anywhere; }
.food-card-meta { font-size: .875rem; color: var(--muted); }
.food-card.bare .food-card-meta { color: var(--note-ink); background: var(--saffron-soft); align-self: flex-start; padding: 2px 10px; border-radius: 999px; font-weight: 600; }
.fab { position: fixed; inset-inline-end: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + var(--safe-b) + 16px); z-index: 8; min-height: 56px; border-radius: 999px; padding: 0 22px; box-shadow: var(--shadow); }
.ingredients { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ingredients li, .ing-line { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 1.0625rem; }
.prose { white-space: pre-wrap; max-width: 65ch; margin-top: 8px; }
.chips.tags { margin: 0; }

/* ---- Food form and ingredient sheet ---- */
.ing-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ing-line { display: flex; align-items: center; gap: 4px; padding: 0; overflow: hidden; }
.ing-line.bad { border-color: var(--warn); background: var(--saffron-soft); }
.ing-line-btn { appearance: none; background: none; border: 0; font: inherit; color: inherit; text-align: start; flex: 1; min-width: 0; padding: 12px 14px; min-height: 52px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
.ing-line-btn small { color: var(--note-ink); font-weight: 600; }
.add-ing { border-style: dashed; color: var(--accent-strong); }
details.more { border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.more > summary { padding: 14px 16px; min-height: 52px; font-weight: 600; cursor: pointer; list-style-position: inside; }
details.more[open] > summary { border-bottom: 1px solid var(--line); }
details.more > .stack { padding: 16px; }
.quick-input textarea { min-height: 56px; font-size: 1.125rem; }
.preview { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; align-items: center; }
.pv { display: inline-flex; flex-direction: column; gap: 0; padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-strong); min-width: 4rem; }
.pv small { font-size: .75rem; color: var(--muted); }
.pv b { font-size: 1.0625rem; }
.pv.missing { background: var(--saffron-soft); color: var(--note-ink); }
.pv.missing small { color: var(--note-ink); }
.sheet-section { display: flex; flex-direction: column; gap: 8px; }
.sheet-section > h4 { font-size: .875rem; }
.added-count { font-size: .9375rem; color: var(--accent-strong); font-weight: 600; }

/* ---- Shopping ---- */
.list-cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.list-card { appearance: none; width: 100%; text-align: start; font: inherit; color: inherit; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.list-card:hover { border-color: var(--accent); }
.list-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.inline-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.add-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.items > li.item { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding-inline: 14px 4px; min-height: 64px; }
.check { display: flex; align-items: center; gap: 14px; padding: 10px 0; flex: 1; cursor: pointer; min-width: 0; font-size: 1.0625rem; }
.check input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 999px; border: 2px solid var(--muted); background: var(--surface); flex: none; display: grid; place-items: center; cursor: pointer; }
.check input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.check input[type="checkbox"]:checked::after { content: "✓"; color: var(--accent-ink); font-weight: 700; font-size: 1.125rem; line-height: 1; }
.done { color: var(--muted); text-decoration: line-through; }
.basket-toggle { appearance: none; background: none; border: 0; font: inherit; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0; cursor: pointer; }
.price { flex: none; display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface-2); padding-inline-start: 12px; }
.price:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.price-symbol { color: var(--muted); }
.price-input { width: 5.5rem; border: 0; background: transparent; text-align: end; min-height: 44px; padding: 6px 12px 6px 6px; }
.price-input:focus-visible { outline: none; }
.price-input[aria-invalid="true"] { color: var(--danger); }
.price:has(.price-input[aria-invalid="true"]) { border-color: var(--danger); }
.trip-bar { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.trip-bar strong { font-size: 1.0625rem; }
.trip-bar span { font-size: .875rem; color: var(--muted); }
.trip-meta { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 20px; }
