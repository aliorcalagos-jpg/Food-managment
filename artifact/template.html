<title>Meal Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Spectral:wght@400;500;600&display=swap">
<style>
/* QuestUI: a fantasy RPG design system. One dark theme (never pure black or white): parchment text on layered
   browns, gold for actions and highlights, deep red for danger, royal purple kept for rare things. Cinzel for
   headings and labels, Spectral for body text; Arabic falls back to the device's serif Arabic fonts. */
:root {
  --bg: #1a0f0a;
  --surface: #2c1a10;
  --surface-2: #3d2517;
  --ink: #f5e6d3;
  --muted: #bfa98a;
  --line: #5c3d2e;
  --accent: #ca8a04;
  --accent-strong: #daa520;
  --accent-ink: #1a0f0a;
  --accent-soft: rgba(202, 138, 4, .15);
  --saffron: #daa520;
  --saffron-soft: rgba(202, 138, 4, .22);
  --danger: #f87171;
  --danger-soft: rgba(153, 27, 27, .3);
  --warn: #daa520;
  --bar-dim: #7a5a1f;
  --note: rgba(202, 138, 4, .15);
  --note-ink: #f2cf86;
  --focus: #ca8a04;
  --blur-bg: rgba(26, 15, 10, .94);
  --scrim: rgba(10, 5, 2, .72);
  --glow-sm: 0 1px 3px rgba(202, 138, 4, .15);
  --glow: 0 2px 8px rgba(202, 138, 4, .2);
  --glow-md: 0 4px 16px rgba(202, 138, 4, .25);
  --glow-lg: 0 8px 32px rgba(202, 138, 4, .3);
  --font-body: Spectral, "Noto Naskh Arabic", "Noto Serif", "Droid Serif", Georgia, serif;
  --font-display: Cinzel, Spectral, "Noto Naskh Arabic", "Noto Serif", Georgia, serif;
  --radius: 4px;
  --radius-sm: 4px;
  --nav-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-end: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 17px/1.4 var(--font-body);
  padding-left: var(--gutter); padding-right: var(--gutter-end);
  padding-block: 0 24px;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
[dir="rtl"] { line-height: 1.55; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 1.1875rem; font-weight: 600; }
h4 { font-size: .8125rem; font-weight: 400; color: var(--muted); font-family: var(--font-body); margin: 0; }
[dir="rtl"] h2 { letter-spacing: 0; }
p { margin: 0; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.arrow, .chev { display: inline-block; }
[dir="rtl"] .arrow, [dir="rtl"] .chev { transform: scaleX(-1); }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
svg.ico { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---- shell: frosted top bar, large titles, frosted tab bar ---- */
.app { max-width: 700px; margin: 0 auto; }
body:has(.week-grid) .app { max-width: 960px; }
.top { position: sticky; top: 0; z-index: 5; margin-inline: calc(var(--gutter) * -1) calc(var(--gutter-end) * -1); padding: env(safe-area-inset-top, 0px) var(--gutter-end) 0 var(--gutter); background: var(--blur-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.top::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: .5px; background: var(--line); opacity: 0; transition: opacity .2s; }
.top.scrolled::after { opacity: 1; }
.top-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; }
.brand { font-size: 1.0625rem; font-weight: 600; text-align: center; }
.lang-switch { appearance: none; background: none; border: 0; font: inherit; color: var(--accent); cursor: pointer; min-height: 44px; padding: 0 4px; justify-self: start; text-align: start; }
.large-title { padding: 2px 0 10px; }
.main { padding-top: 4px; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 112px); }
.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: var(--blur-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--line); padding-bottom: var(--safe-b);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.bottom-nav-in { max-width: 700px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
body:has(.week-grid) .bottom-nav-in { max-width: 960px; }
.nav-btn { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: .6875rem; font-weight: 500; min-height: var(--nav-h); padding: 5px 2px 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.nav-ico { display: grid; place-items: center; }
.nav-btn[aria-current="page"] { color: var(--accent); }
body:has(.modal-bar) .bottom-nav, body:has(.modal-bar) .top { display: none; }

.sticky-bar { position: fixed; inset-inline: 0; bottom: calc(var(--nav-h) + var(--safe-b)); z-index: 9; background: var(--blur-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); padding: 8px var(--gutter-end) 8px var(--gutter); }
.sticky-in { max-width: 700px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
body:has(.week-grid) .sticky-in { max-width: 960px; }
.bar-summary { flex: 1; min-width: 0; text-align: start; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 2px 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
.bar-summary strong { font-size: 1.0625rem; font-weight: 600; }
.bar-summary span { font-size: .8125rem; color: var(--muted); }

/* a modal screen (new / edit food) has its own bar: Cancel, title, Save */
.modal-bar { position: sticky; top: 0; z-index: 12; margin-inline: calc(var(--gutter) * -1) calc(var(--gutter-end) * -1); padding: env(safe-area-inset-top, 0px) var(--gutter-end) 0 var(--gutter); background: var(--blur-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; }
.modal-bar h2 { font-size: 1.0625rem; font-weight: 600; text-align: center; }
.modal-bar .bar-btn { appearance: none; background: none; border: 0; font: inherit; color: var(--accent); cursor: pointer; min-height: 44px; padding: 0 4px; justify-self: start; }
.modal-bar .bar-btn.strong { font-weight: 600; justify-self: end; }
.modal-bar .bar-btn:disabled { opacity: .4; }

/* ---- sheets ---- */
.sheet-overlay { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); color: var(--ink); border-radius: 14px 14px 0 0; padding: 0 var(--gutter-end) calc(20px + var(--safe-b)) var(--gutter); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 700px) { .sheet-overlay { align-items: center; } .sheet { border-radius: 14px; max-height: 88dvh; } }
.sheet > * { flex-shrink: 0; }
.sheet-grab { touch-action: none; cursor: grab; padding: 8px 0 0; margin-inline: calc(var(--gutter) * -1) calc(var(--gutter-end) * -1); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sheet-grab::before { content: ""; width: 36px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; align-self: stretch; padding-inline: var(--gutter) var(--gutter-end); }
.sheet-close { appearance: none; background: var(--surface-2); border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 1rem; color: var(--muted); cursor: pointer; flex: none; }
.action-overlay { align-items: flex-end; padding: 0 8px calc(8px + var(--safe-b)); }
.action-sheet { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
.action-group { background: var(--blur-bg); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; background-color: var(--surface); }
.action-title { text-align: center; padding: 14px 16px; font-size: .8125rem; color: var(--muted); }
.action-btn { appearance: none; border: 0; border-top: .5px solid var(--line); background: var(--surface); font: inherit; font-size: 1.1875rem; min-height: 56px; cursor: pointer; color: var(--accent); }
.action-btn.danger { color: var(--danger); }
.action-btn.cancel { border: 0; border-radius: 14px; font-weight: 600; background: var(--surface); }
@media (min-width: 700px) { .action-overlay { align-items: center; } }

/* ---- controls ---- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 6px; }
.page-head .large-title { padding-bottom: 6px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; }

input, select, textarea {
  font: inherit; font-size: 1.0625rem; color: var(--ink); background: var(--surface); border: 0;
  border-radius: var(--radius-sm); padding: 12px 14px; width: 100%; min-width: 0; min-height: 44px;
}
.field input, .field select, .field textarea, .add-item input, .inline-form input, .search input { box-shadow: inset 0 0 0 .5px var(--line); }
textarea { resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, legend { font-size: .8125rem; color: var(--muted); padding-inline: 16px; }
.field-error { color: var(--danger); font-size: .875rem; padding-inline: 16px; }
[aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--danger) !important; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.search { margin-bottom: 14px; }
.hint { font-size: .8125rem; padding-inline: 16px; }
input[type="search"] { -webkit-appearance: none; appearance: none; background: var(--surface-2); box-shadow: none !important; border-radius: 10px; }

.btn {
  font: inherit; font-weight: 600; font-size: 1.0625rem; border-radius: 12px; padding: 12px 20px; min-height: 50px; cursor: pointer;
  border: 0; background: var(--surface-2); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:active { opacity: .85; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.ghost { background: var(--surface-2); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.link { appearance: none; background: none; border: 0; padding: 8px 4px; font: inherit; color: var(--accent); cursor: pointer; min-height: 44px; }
.link.danger { color: var(--danger); }
.back { appearance: none; background: none; border: 0; padding: 0 8px 0 0; padding-inline: 0 8px; font: inherit; font-size: 1.0625rem; color: var(--accent); min-height: 44px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.back .arrow { font-size: 1.4em; line-height: 1; }
.icon-btn { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; width: 44px; min-height: 44px; cursor: pointer; border-radius: 12px; flex: none; }
.icon-btn:hover:not(:disabled) { color: var(--danger); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.add-btn { appearance: none; border: 0; background: var(--accent); color: var(--accent-ink); width: 44px; height: 44px; border-radius: 999px; font-size: 1.5rem; line-height: 1; cursor: pointer; flex: none; display: grid; place-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: .9375rem; padding: 8px 16px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--ink); cursor: pointer; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.chip-row .chip { flex: none; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--saffron-soft); color: var(--note-ink); font: 600 .75rem var(--font-body); vertical-align: middle; }
.segmented { display: inline-flex; flex-wrap: nowrap; gap: 2px; background: var(--surface-2); padding: 2px; border-radius: 9px; align-self: flex-start; }
.segmented .chip { background: none; border-radius: 7px; padding: 6px 16px; min-height: 44px; font-weight: 500; }
.segmented .chip[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--note); color: var(--note-ink); padding: 12px 16px; border-radius: var(--radius); font-size: .9375rem; }
.banner .link { color: inherit; }
.banner.error { background: var(--danger-soft); color: var(--danger); }
.main .banner { margin: 0 0 14px; }
.empty { padding: 36px 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.empty-title { font: 700 1.25rem var(--font-display); }
.empty-inline { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 8px; }

/* iOS stepper: one rounded rectangle split by a hairline, the count beside it */
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper .icon-btn { width: 47px; min-height: 44px; background: var(--surface-2); color: var(--ink); font-size: 1.375rem; line-height: 1; border-radius: 0; }
.stepper .icon-btn:first-child { border-start-start-radius: 9px; border-end-start-radius: 9px; border-inline-end: .5px solid var(--line); }
.stepper .icon-btn:last-of-type { border-start-end-radius: 9px; border-end-end-radius: 9px; order: 3; }
.stepper-n { min-width: 2rem; text-align: center; font-weight: 600; font-size: 1.0625rem; order: 2; }
.stepper .icon-btn:first-child { order: 1; }

/* ---- inset grouped lists ---- */
.group, .picks, .food-grid, .list-cards, .items, .ing-list, .rows, .ingredients { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.group > li, .picks > li, .food-grid > li, .list-cards > li, .items > li, .ing-list > li, .rows > li, .ingredients > li { position: relative; }
.group > li + li::before, .picks > li + li::before, .food-grid > li + li::before, .list-cards > li + li::before, .items > li + li::before, .ing-list > li + li::before, .rows > li + li::before, .ingredients > li + li::before {
  content: ""; position: absolute; top: 0; inset-inline: 16px 0; height: .5px; background: var(--line); z-index: 1; pointer-events: none;
}
.section-title, .aisle-title { margin: 22px 0 6px; padding-inline: 16px; font: 400 .8125rem var(--font-body); color: var(--muted); text-transform: none; }
.aisle { margin-top: 0; }
.row-title { font-weight: 600; }
.ingredients li { padding: 12px 16px; }

/* ---- This week ---- */
.week-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 18px; }
.week-btn { appearance: none; border: 0; background: var(--surface); color: var(--accent); width: 44px; height: 44px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; font: inherit; flex: none; }
.week-mid { display: flex; flex-direction: column; align-items: center; min-width: 0; text-align: center; }
.week-range { font-weight: 600; }
.week-now { appearance: none; background: none; border: 0; font: inherit; font-size: .8125rem; color: var(--accent); cursor: pointer; padding: 0 8px; min-height: 24px; }
.week-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 900px) { .week-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 24rem); } .buy { position: sticky; top: 64px; } }
.pick { display: flex; flex-direction: column; gap: 0; padding: 0 16px 0 0; padding-inline: 0 16px; }
.pick-btn { appearance: none; background: none; border: 0; padding: 0; padding-inline: 16px 0; font: inherit; font-size: 1.0625rem; color: inherit; text-align: start; cursor: pointer; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; }
.pick-btn bdi { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pick-check { flex: none; width: 26px; height: 26px; border-radius: 999px; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; font-weight: 700; font-size: .875rem; }
.pick.on .pick-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 0 0 12px; padding-inline-start: 54px; }
.pick-foot .muted { font-size: .8125rem; }
.pick-note { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; padding-bottom: 8px; padding-inline-start: 54px; }
.pick-note .link { padding: 4px 0; font-size: .9375rem; }
.buy { display: flex; flex-direction: column; gap: 12px; }
.buy-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.buy-head h3 { margin: 0; font-size: 1.25rem; }
.buy-item { padding: 12px 16px; font-size: 1.0625rem; }
.buy .banner { margin: 0; }

/* ---- Foods ---- */
.food-card, .list-card { appearance: none; width: 100%; text-align: start; min-height: 60px; display: flex; flex-direction: column; justify-content: center; gap: 2px; background: none; border: 0; padding: 10px 40px 10px 16px; padding-inline: 16px 40px; font: inherit; color: inherit; cursor: pointer; position: relative; }
.food-card::after, .list-card::after { content: "›"; position: absolute; inset-inline-end: 16px; top: 50%; transform: translateY(-50%); color: var(--line); font-size: 1.5rem; line-height: 1; }
[dir="rtl"] .food-card::after, [dir="rtl"] .list-card::after { content: "‹"; }
.food-card-title { font-size: 1.0625rem; overflow-wrap: anywhere; }
.food-card-meta { font-size: .8125rem; color: var(--muted); }
.food-card.bare .food-card-meta { color: var(--warn); }
.prose { white-space: pre-wrap; max-width: 65ch; margin-top: 8px; }
.chips.tags { margin: 0; }

/* ---- food form and ingredient sheet ---- */
.ing-line { display: flex; align-items: center; gap: 4px; min-height: 52px; }
.ing-line.bad { background: var(--saffron-soft); }
.ing-line-btn { appearance: none; background: none; border: 0; font: inherit; color: inherit; text-align: start; flex: 1; min-width: 0; padding: 12px 16px; min-height: 52px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
.ing-line-btn small { color: var(--warn); font-weight: 600; }
.add-ing { background: var(--surface); }
details.more { background: var(--surface); border-radius: var(--radius); }
details.more > summary { padding: 12px 16px; min-height: 48px; cursor: pointer; display: flex; align-items: center; }
details.more > .stack { padding: 4px 16px 16px; }
.quick-input textarea { min-height: 56px; font-size: 1.1875rem; }
.preview { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; align-items: center; }
.pv { display: inline-flex; flex-direction: column; padding: 6px 14px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-strong); min-width: 4rem; }
.pv small { font-size: .6875rem; color: var(--muted); }
.pv b { font-size: 1.0625rem; font-weight: 600; }
.pv.missing { background: var(--saffron-soft); color: var(--note-ink); }
.pv.missing small { color: var(--note-ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.25rem, 1fr)); gap: 8px; }
.tile { appearance: none; border: 0; background: var(--surface); color: var(--ink); font: inherit; border-radius: 12px; padding: 8px 4px 6px; min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; cursor: pointer; text-align: center; }
.tile[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.tile-name { font-size: .8125rem; line-height: 1.25; overflow-wrap: anywhere; }
.tile .sub { display: block; color: var(--muted); font-size: .6875rem; }
.food-icon { flex: none; filter: drop-shadow(0 0 .6px rgba(0, 0, 0, .45)); }
.pv-name { display: inline-flex; align-items: center; gap: 6px; }
.ing-icon-gap { width: 30px; height: 30px; flex: none; }
.ing-line-btn { flex-direction: row; align-items: center; gap: 12px; }
.ing-text { display: flex; flex-direction: column; }
.ing-row-detail { display: flex; align-items: center; gap: 12px; }
.sheet-section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.often-items { max-height: 11rem; overflow-y: auto; }
.tile-gap { width: 44px; height: 44px; }
.pick-table { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.pick-row { display: grid; grid-template-columns: minmax(0, 1fr) 4.25rem 6rem 44px; gap: 6px; align-items: center; padding: 6px 4px 6px 12px; padding-inline: 12px 4px; position: relative; }
.pick-row + .pick-row::before { content: ""; position: absolute; top: 0; inset-inline: 12px 0; height: .5px; background: var(--line); }
.pick-row-name { display: flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.pick-qty, .pick-unit { min-height: 44px; padding-inline: 8px; background: var(--surface-2); }
.chip.suggested { box-shadow: inset 0 0 0 2px var(--accent); }
.chip .sub { font-size: .75rem; opacity: .7; }
.catalog-items { max-height: 20rem; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 2px; }
.sheet-section { display: flex; flex-direction: column; gap: 8px; }
.added-count { font-size: .9375rem; color: var(--accent); font-weight: 600; }

/* ---- Shopping ---- */
.list-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.progress { height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.inline-form, .add-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.item { display: flex; align-items: center; gap: 4px; min-height: 56px; padding-inline: 16px 4px; background-color: var(--surface); }
.check { display: flex; align-items: center; gap: 14px; padding: 10px 0; flex: 1; cursor: pointer; min-width: 0; font-size: 1.0625rem; }
.check input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; min-height: 0; padding: 0; border-radius: 999px; border: 1.5px solid var(--line); background: none; box-shadow: none; flex: none; display: grid; place-items: center; cursor: pointer; }
.check input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.check input[type="checkbox"]:checked::after { content: "✓"; color: var(--accent-ink); font-weight: 700; font-size: .9375rem; line-height: 1; }
.done { color: var(--muted); text-decoration: line-through; }
.basket-toggle { appearance: none; background: none; border: 0; font: inherit; font-size: .8125rem; color: var(--muted); display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; cursor: pointer; }
.price { flex: none; display: flex; align-items: center; background: var(--surface-2); border-radius: 8px; padding-inline-start: 10px; }
.price:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.price-symbol { color: var(--muted); }
.price-input { width: 5.25rem; border: 0; background: transparent; text-align: end; min-height: 36px; padding: 6px 10px 6px 4px; box-shadow: none !important; }
.price-input:focus-visible { outline: none; }
.price-input[aria-invalid="true"] { color: var(--danger); }
.price:has(.price-input[aria-invalid="true"]) { box-shadow: inset 0 0 0 1.5px var(--danger); }
.trip-bar { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.trip-bar strong { font-size: 1.0625rem; font-weight: 600; }
.trip-bar span { font-size: .8125rem; color: var(--muted); }
.trip-meta { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 20px; }
.totals { margin: 0; }

/* swipe rows */
.swipe { overflow: hidden; background-color: var(--surface); }
.swipe-content { position: relative; background: var(--surface); touch-action: pan-y; will-change: transform; }
.swipe.dragging .swipe-content { transition: none; }
.swipe:not(.dragging) .swipe-content { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.swipe-act { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; width: 88px; border: 0; color: #fff; font: inherit; font-size: 1rem; cursor: pointer; }
.swipe-lead { inset-inline-start: 0; background: var(--accent); }
.swipe-trail { inset-inline-end: 0; background: var(--danger); }
.swipe-act { visibility: hidden; }
.swipe.revealing-lead .swipe-lead, .swipe.revealing-trail .swipe-trail { visibility: visible; }
/* the visible remove buttons are for mouse and keyboard; on a touch screen the swipe replaces them */
@media (hover: none) and (pointer: coarse) { .row-remove { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }

/* ---- Spending ---- */
.hero-card .hero { font: 700 clamp(2.5rem, 11vw, 3.5rem)/1.05 var(--font-body); font-variant-numeric: normal; margin: 6px 0 2px; }
.other-money { font-size: .9375rem; }
.meter { height: 14px; border-radius: 999px; background: var(--surface-2); display: flex; overflow: hidden; margin: 16px 0 12px; }
.meter-fill { height: 100%; background: var(--accent); }
.meter-fill.warn { background: var(--warn); }
.meter-fill.over { background: var(--danger); }
/* planned-but-not-bought: hatched, so it is told apart by pattern and not only by colour */
.meter-plan { height: 100%; background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 6px); opacity: .35; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 600; }
.status-icon { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font: 700 .875rem var(--font-body); flex: none; }
.status.ok .status-icon { background: var(--accent-soft); color: var(--accent); }
.status.warn .status-icon { background: var(--note); color: var(--note-ink); }
.status.over .status-icon { background: var(--danger-soft); color: var(--danger); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 12px 16px; margin: 16px 0 0; }
.facts dt { font-size: .875rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }
.chart > h3 { margin: 4px 0 10px; }
.bars { list-style: none; margin: 0; padding: 0; }
.bar-row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; }
.bar-label { font-size: .9375rem; }
.bar-track { height: 16px; display: flex; }
.bar-fill { height: 100%; min-width: 2px; background: var(--accent); border-start-end-radius: 4px; border-end-end-radius: 4px; }
.bar-value { font-weight: 600; font-size: .9375rem; }
.history { --plot-h: 140px; --label-h: 30px; --value-h: 22px; position: relative; display: flex; gap: 6px; }
.col { flex: 1 1 0; min-width: 0; display: grid; grid-template-rows: var(--value-h) var(--plot-h) var(--label-h); justify-items: center; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; }
.col-value { font-size: .75rem; font-weight: 600; align-self: end; }
/* the baseline is a shadow, not a border: a border would shave 1px off the plot and put bars on a different scale than the budget line */
.col-plot { width: 100%; display: flex; align-items: flex-end; justify-content: center; box-shadow: 0 1px 0 var(--line); }
.col-bar { width: min(100%, 24px); background: var(--bar-dim); border-radius: 4px 4px 0 0; }
.col-bar.selected { background: var(--accent); }
.col-label { font-size: .75rem; color: var(--muted); text-align: center; align-self: center; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.col-label small { font-size: .6875rem; }
.col[aria-pressed="true"] .col-label { color: var(--ink); font-weight: 600; }
.axis-max { position: absolute; inset-inline-start: 0; top: 0; font-size: .75rem; color: var(--muted); }
.budget-line { position: absolute; inset-inline: 0; bottom: calc(var(--label-h) + var(--plot-h) * var(--budget)); border-top: 2px solid var(--ink); pointer-events: none; }
.budget-tag { position: absolute; inset-inline-start: 0; bottom: 3px; font-size: .75rem; color: var(--muted); background: var(--surface); padding-inline: 4px; }
.numbers { margin-top: 8px; }
.numbers summary { cursor: pointer; color: var(--accent); min-height: 44px; display: flex; align-items: center; }
.numbers table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .9375rem; }
.numbers th, .numbers td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); font-weight: 400; }
.numbers thead th { font-size: .8125rem; color: var(--muted); }
.settings summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
.settings .stack { margin-top: 12px; }
.segmented { display: flex; flex-wrap: wrap; gap: 8px; }
.field > .label { font-size: .8125rem; color: var(--muted); padding-inline: 16px; }
.small { font-size: .875rem; }
.status-note { margin: 4px 0 0; padding-inline-start: 32px; color: var(--note-ink); }
.row-btn { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 16px; width: 100%; text-align: start; background: none; border: 0; padding: 14px 2px; font: inherit; color: inherit; cursor: pointer; min-height: 52px; }
.row-btn:hover .row-title { color: var(--accent); }

/* landscape iPhone: compact bars so the content keeps most of the height */
@media (max-height: 500px) {
  :root { --nav-h: 38px; }
  .nav-btn { flex-direction: row; gap: 8px; min-height: 38px; padding: 2px; font-size: .75rem; }
  svg.ico { width: 20px; height: 20px; }
  .top-row { min-height: 38px; }
  .lang-switch { min-height: 38px; }
  .bar-summary { min-height: 40px; }
  .bar-summary span { display: none; }
  .sticky-bar { padding-block: 4px; }
  .main { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 72px); }
}

/* ---- Pilot: the floating guide ---- */
.pilot-toggle { justify-self: end; text-align: end; }
.pilot-toggle[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.pilot-fab { position: fixed; z-index: 42; inset-inline-end: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + var(--safe-b) + 92px); width: 52px; height: 52px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 16px rgba(0, 0, 0, .28); display: grid; place-items: center; cursor: grab; touch-action: none; }
/* with a sheet open the button waits in the dimmed strip at the top instead of covering the sheet */
body:has(.sheet-overlay) .pilot-fab:not(.placed) { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 8px); }
.pilot-fab.placed { inset-inline-end: auto; bottom: auto; }
.pilot-fab svg.ico { width: 28px; height: 28px; }
.pilot-dot { position: absolute; top: 2px; inset-inline-end: 2px; width: 12px; height: 12px; border-radius: 999px; background: var(--saffron); border: 2px solid var(--surface); }
.pilot-badge { position: absolute; bottom: -6px; inset-inline-end: -6px; min-width: 28px; padding: 1px 6px; border-radius: 999px; background: var(--surface); color: var(--ink); font-size: .6875rem; font-weight: 600; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.pilot-ring { position: fixed; z-index: 40; border-radius: 14px; pointer-events: none; box-shadow: 0 0 0 3px var(--saffron), 0 0 0 9999px rgba(0, 0, 0, .28); transition: top .2s, left .2s, width .2s, height .2s; }
.pilot-callout { position: fixed; z-index: 41; inset-inline: max(16px, env(safe-area-inset-left, 0px)); margin-inline: auto; max-width: 360px; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .3); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.pilot-callout span { font-size: .9375rem; color: var(--muted); }
.pilot-head-actions { display: inline-flex; align-items: center; gap: 4px; }
.pilot-stop { align-self: flex-start; font-size: .875rem; color: var(--muted); padding: 0 4px; min-height: 36px; }
.pilot-card { position: fixed; z-index: 43; inset-inline: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(var(--nav-h) + var(--safe-b) + 8px); margin-inline: auto; max-width: 420px; max-height: 60dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 14px 16px 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 10px; }
.pilot-card.top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 8px); }
.pilot-head { display: flex; align-items: center; justify-content: space-between; }
.pilot-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pilot-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pilot-choice { appearance: none; width: 100%; border: 0; background: var(--surface-2); color: inherit; font: inherit; text-align: start; border-radius: 12px; padding: 12px 14px; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
.pilot-choice small { display: block; color: var(--muted); font-size: .8125rem; }
.pilot-steps li { display: flex; align-items: center; }
.pilot-steps li.now { color: var(--ink); font-weight: 600; }
.pilot-steps li.is-done { color: var(--muted); }
.pilot-mark { flex: none; width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .75rem; color: var(--accent-ink); }
.pilot-steps li.is-done .pilot-mark { background: var(--accent); border-color: var(--accent); }
.pilot-steps li.now .pilot-mark { border-color: var(--saffron); box-shadow: 0 0 0 3px var(--saffron-soft); }
.pilot-step { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px; }
.pilot-step p { margin: 0; }
.pilot-step .actions { margin-top: 4px; }
.pilot-step h4 { color: var(--ink); font-size: 1.0625rem; font-weight: 600; }
.pilot-note { color: var(--accent-strong); font-weight: 600; font-size: .9375rem; }
@media (prefers-reduced-motion: no-preference) {
  .pilot-dot, .pilot-ring { animation: pilot-pulse 1.8s ease-in-out infinite; }
  @keyframes pilot-pulse { 50% { opacity: .65; } }
}
@media (prefers-reduced-motion: reduce) { .pilot-ring { transition: none; } }
@media (max-height: 500px) { .pilot-fab { bottom: calc(var(--nav-h) + var(--safe-b) + 60px); } .pilot-card { max-height: 80dvh; } }
@media (max-width: 520px) {
  .two { grid-template-columns: minmax(0, 1fr); }
  .bar-row { grid-template-columns: 5rem minmax(0, 1fr) auto; gap: 8px; }
  .price-input { width: 4.5rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .nav-btn, .pick-check { transition: background-color .15s, color .15s, opacity .15s; }
  .sheet { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
}

.needed { display: block; margin-top: 2px; line-height: 1.5; }
.aisle-sum { margin: 0 0 6px; padding-inline: 16px; font-size: .875rem; color: var(--muted); }
.aisle-sum strong { color: var(--accent-strong); font-weight: 600; }
.check-text { display: flex; flex-direction: column; min-width: 0; }

.backup-last { margin: 4px 0 8px; font-size: .9375rem; }
.backup-last.due { color: var(--accent-strong); }
.backup-ok { color: #22c55e; margin: 8px 0 0; }

/* ---- QuestUI components: angular 4px corners, bordered layered surfaces, gold glow on what is active ---- */
body { font-size: 16px; line-height: 1.7; }
[dir="rtl"] { line-height: 1.75; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: .01em; }
h2 { font-size: 1.75rem; font-weight: 700; }
h3 { font-weight: 600; }
h4 { font-family: var(--font-display); font-size: .8125rem; letter-spacing: .04em; }
.brand { font-family: var(--font-display); font-weight: 700; letter-spacing: .06em; color: var(--accent-strong); }
.top, .modal-bar { border-bottom: 1px solid var(--line); }
.top::after { display: none; }
.bottom-nav, .sticky-bar { border-top: 1px solid var(--line); box-shadow: 0 -2px 12px rgba(0, 0, 0, .35); }
.nav-btn { font-family: var(--font-display); letter-spacing: .03em; font-size: .6875rem; position: relative; }
.nav-btn[aria-current="page"] { color: var(--accent-strong); text-shadow: 0 0 12px rgba(202, 138, 4, .6); }
.nav-btn[aria-current="page"]::before { content: ""; position: absolute; top: 0; inset-inline: 22%; height: 2px; background: var(--accent); box-shadow: var(--glow-md); }

.card, .group, .picks, .food-grid, .list-cards, .items, .ing-list, .rows, .ingredients, .pick-table, details.more { border: 1px solid var(--line); box-shadow: var(--glow-sm); }
.card { padding: 20px 16px; }
.hero-card, .buy .card, .pilot-card, .sheet { border-top: 2px solid var(--accent); }
.group > li + li::before, .picks > li + li::before, .food-grid > li + li::before, .list-cards > li + li::before, .items > li + li::before, .ing-list > li + li::before, .rows > li + li::before, .ingredients > li + li::before, .pick-row + .pick-row::before { height: 1px; background: var(--surface-2); inset-inline: 0; }
.section-title, .aisle-title { font-family: var(--font-display); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

input, select, textarea { font-family: var(--font-body); font-size: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: none; }
input:hover, select:hover, textarea:hover { border-color: var(--accent); }
.field input, .field select, .field textarea, .add-item input, .inline-form input, .search input { box-shadow: none; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(202, 138, 4, .25) !important; }
input[type="search"] { background: var(--surface); border-radius: 4px; }
[aria-invalid="true"] { border-color: #991b1b !important; box-shadow: 0 0 0 3px rgba(153, 27, 27, .25) !important; }
.field > label, legend, .field > .label { font-size: .875rem; font-weight: 500; color: var(--ink); }
.hint, .field-error { padding-inline: 0; }
:focus-visible { outline: 2px solid var(--accent); }

.btn { font-family: var(--font-display); font-weight: 600; font-size: .9375rem; letter-spacing: .06em; border-radius: 4px; border: 1px solid var(--accent); background: rgba(202, 138, 4, .08); color: var(--accent-strong); box-shadow: var(--glow-sm); min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-strong); box-shadow: var(--glow); }
.btn.primary:active, .btn.primary:hover { background: #b8780a; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
.btn.danger { background: #991b1b; color: var(--ink); border-color: #b91c1c; }
.btn:disabled { opacity: .35; box-shadow: none; border-color: var(--line); }
.link, .back, .modal-bar .bar-btn, .lang-switch, .week-now { color: var(--accent-strong); font-family: var(--font-display); letter-spacing: .03em; }
.link.danger { color: var(--danger); }
.add-btn { border-radius: 4px; border: 1px solid var(--accent-strong); box-shadow: var(--glow); }
.icon-btn, .week-btn { border-radius: 4px; }
.week-btn { border: 1px solid var(--line); }
.sheet-close { border-radius: 4px; background: var(--surface-2); color: var(--ink); }

.chip { font-family: var(--font-display); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; border-radius: 2px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: var(--glow); }
.pill { border-radius: 2px; font-family: var(--font-display); font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; background: var(--saffron-soft); color: var(--accent-strong); }
.segmented { border-radius: 4px; background: var(--surface); border: 1px solid var(--line); }
.segmented .chip { border-color: transparent; border-radius: 2px; }
.segmented .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); }
.banner { border: 1px solid rgba(202, 138, 4, .4); }
.banner.error { border-color: #991b1b; color: var(--danger); }
.stepper .icon-btn { background: var(--surface-2); border-radius: 0; border: 1px solid var(--line); }
.stepper .icon-btn:first-child { border-start-start-radius: 4px; border-end-start-radius: 4px; border-inline-end: 0; }
.stepper .icon-btn:last-of-type { border-start-end-radius: 4px; border-end-end-radius: 4px; }
.tile { border: 1px solid var(--line); border-radius: 4px; }
.tile[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: var(--glow-md); }
.pv { border-radius: 4px; border: 1px solid rgba(202, 138, 4, .4); color: var(--accent-strong); }
.pick-check, .check input[type="checkbox"] { border: 2px solid var(--line); border-radius: 2px; background: var(--surface); }
.pick.on .pick-check, .check input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.check input[type="checkbox"]:checked::after { color: var(--accent-ink); }
.pick-check, .check input[type="checkbox"] { width: 24px; height: 24px; }
.price { border-radius: 4px; border: 1px solid var(--line); background: var(--surface); }
.progress, .meter { border-radius: 2px; background: var(--bg); border: 1px solid var(--line); }
.progress-fill, .meter-fill { border-radius: 0; box-shadow: 0 0 10px rgba(202, 138, 4, .5); }
.meter-fill.over { background: #991b1b; box-shadow: none; }
.status.ok .status-icon { background: rgba(34, 197, 94, .15); color: #22c55e; }
.hero-card .hero { font-family: var(--font-display); color: var(--accent-strong); text-shadow: 0 0 18px rgba(202, 138, 4, .35); }
.swipe-act { color: var(--ink); }
.swipe-lead { background: #166534; }
.swipe-trail { background: #991b1b; }
.sheet-overlay .sheet, .action-group { box-shadow: var(--glow-lg); }
.sheet { border-radius: 6px 6px 0 0; border: 1px solid var(--line); border-bottom: 0; }
@media (min-width: 700px) { .sheet { border-radius: 6px; border-bottom: 1px solid var(--line); } }
.sheet-grab::before { border-radius: 2px; background: var(--line); }
.action-group, .action-btn.cancel { border-radius: 6px; border: 1px solid var(--line); }
.action-btn { font-family: var(--font-display); font-size: 1rem; letter-spacing: .05em; border-top: 1px solid var(--line); color: var(--accent-strong); }
.action-btn.danger { color: var(--danger); }
.pilot-fab { border-radius: 999px; border: 1px solid var(--accent-strong); box-shadow: var(--glow-lg); }
.pilot-card, .pilot-callout { border-radius: 6px; border: 1px solid var(--line); box-shadow: var(--glow-lg); }
.pilot-choice, .pilot-step { border-radius: 4px; border: 1px solid var(--line); }
.pilot-ring { border-radius: 6px; box-shadow: 0 0 0 3px var(--accent), 0 0 24px 4px rgba(202, 138, 4, .6), 0 0 0 9999px rgba(0, 0, 0, .4); }
.bar-fill, .col-bar { border-radius: 2px; }
.col-bar.selected, .bar-fill { box-shadow: 0 0 10px rgba(202, 138, 4, .45); }
.budget-line { border-top-color: var(--accent-strong); }
.empty-title { font-family: var(--font-display); }
.numbers th, .numbers td { border-bottom-color: var(--surface-2); }

/* ---- motion: every effect is a transform, opacity or glow (cheap on a phone). "Full" does all of it, "Calm" keeps
   fades and the tick, "Off" (data-fx on <html>, set in Settings) switches every animation and transition off. ---- */
.nav-btn[aria-current="page"]::before { display: none; }
.bottom-nav-in { position: relative; }
.nav-ind { position: absolute; top: 0; height: 2px; width: 25%; inset-inline-start: calc(var(--i, 0) * 25%); background: var(--accent); box-shadow: var(--glow-md); pointer-events: none; }
.btn, .chip, .tile, .add-btn, .nav-btn, .week-btn, .pick-btn { position: relative; overflow: hidden; }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: scale(0); background: radial-gradient(circle, rgba(245, 230, 211, .38), rgba(202, 138, 4, .22) 45%, transparent 68%); animation: ripple .6s ease-out forwards; }
.flash { border-radius: 2px; padding-inline: 2px; }
.complete { position: relative; margin: 0; padding: 10px 14px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent-soft); color: var(--accent-strong); font-family: var(--font-display); letter-spacing: .04em; }
.burst { position: absolute; inset-inline-start: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--accent-strong); box-shadow: 0 0 8px var(--accent); animation: spark 1s ease-out forwards; }
.toast { position: fixed; inset-inline: 16px; bottom: calc(var(--nav-h) + var(--safe-b) + 84px); margin-inline: auto; max-width: 420px; z-index: 60; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px; padding-inline: 16px 8px; background: var(--surface-2); border: 1px solid var(--accent); border-radius: 4px; box-shadow: var(--glow-lg); }
.done { transition: color .3s; }

html:not([data-fx="off"]) .nav-ind { transition: inset-inline-start .32s ease; }
html:not([data-fx="off"]) .main > section { animation: fade-in .3s ease both; }
html:not([data-fx="off"]) .sheet-overlay { animation: fade-in .2s ease both; }
html:not([data-fx="off"]) .progress-fill { transition: width .5s cubic-bezier(.2, .8, .2, 1); }
html:not([data-fx="off"]) .toast { animation: toast-in .3s cubic-bezier(.2, 1.2, .4, 1); }
html:not([data-fx="off"]) .check input[type="checkbox"]:checked::after { animation: check-pop .3s .05s both; }

html[data-fx="full"] .nav-ind { transition: inset-inline-start .4s cubic-bezier(.3, 1.35, .5, 1); }
html[data-fx="full"] .sheet { animation: rise-spring .45s cubic-bezier(.2, 1.2, .35, 1); }
html[data-fx="full"] .picks > li, html[data-fx="full"] .items > li, html[data-fx="full"] .rows > li, html[data-fx="full"] .list-cards > li, html[data-fx="full"] .food-grid > li, html[data-fx="full"] .pick-table > li { animation: row-in .36s cubic-bezier(.2, .8, .2, 1) both; }
html[data-fx="full"] :is(.picks, .items, .rows, .list-cards, .food-grid) > li:nth-child(2) { animation-delay: 40ms; }
html[data-fx="full"] :is(.picks, .items, .rows, .list-cards, .food-grid) > li:nth-child(3) { animation-delay: 80ms; }
html[data-fx="full"] :is(.picks, .items, .rows, .list-cards, .food-grid) > li:nth-child(4) { animation-delay: 120ms; }
html[data-fx="full"] :is(.picks, .items, .rows, .list-cards, .food-grid) > li:nth-child(n+5) { animation-delay: 160ms; }
html[data-fx="full"] .flash { animation: flash 1.1s ease-out; }
html[data-fx="full"] .check input.stamp:checked { animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1), ring .7s ease-out; }
html[data-fx="full"] .complete { animation: complete-in .55s cubic-bezier(.2, 1.4, .4, 1), glow-pulse 1.8s ease-out; }
html[data-fx="full"] .meter-fill, html[data-fx="full"] .meter-plan, html[data-fx="full"] .bar-fill { transform-origin: 0 50%; animation: grow-x .8s cubic-bezier(.2, .8, .2, 1) both; }
html[data-fx="full"] [dir="rtl"] .meter-fill, html[data-fx="full"] [dir="rtl"] .meter-plan, html[data-fx="full"] [dir="rtl"] .bar-fill, html[data-fx="full"][dir="rtl"] .meter-fill, html[data-fx="full"][dir="rtl"] .meter-plan, html[data-fx="full"][dir="rtl"] .bar-fill { transform-origin: 100% 50%; }
html[data-fx="full"] .progress-fill { transform-origin: 0 50%; animation: grow-x .8s cubic-bezier(.2, .8, .2, 1) both; }
html[data-fx="full"][dir="rtl"] .progress-fill, html[data-fx="full"] [dir="rtl"] .progress-fill { transform-origin: 100% 50%; }
html[data-fx="full"] .col-bar { transform-origin: 50% 100%; animation: grow-y .8s cubic-bezier(.2, .8, .2, 1) both; }
html[data-fx="full"] .meter:has(.meter-fill.over) { animation: shake .5s .7s both; }
html[data-fx="full"] :is(.btn, .chip, .tile, .add-btn, .pick-btn, .nav-btn):active { transform: scale(.97); }
html[data-fx="full"] :is(.btn, .chip, .tile, .add-btn, .pick-btn, .nav-btn) { transition: transform .12s ease, background-color .15s, color .15s, opacity .15s, box-shadow .2s; }
html[data-fx="full"] .btn.primary:not(:disabled):hover, html[data-fx="full"] .chip[aria-pressed="true"] { box-shadow: var(--glow-md); }
html:not([data-fx="full"]) .burst, html:not([data-fx="full"]) .ripple { display: none; }

html[data-fx="off"] *, html[data-fx="off"] *::before, html[data-fx="off"] *::after { animation: none !important; transition: none !important; }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes row-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes rise-spring { from { transform: translateY(60px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
@keyframes flash { 0% { background: rgba(202, 138, 4, .6); } 100% { background: transparent; } }
@keyframes check-pop { from { transform: scale(0) rotate(-35deg); } to { transform: none; } }
@keyframes stamp { 0% { transform: scale(.6); } 55% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(202, 138, 4, .75); } 100% { box-shadow: 0 0 0 16px rgba(202, 138, 4, 0); } }
@keyframes complete-in { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes glow-pulse { 0% { box-shadow: 0 0 0 0 rgba(202, 138, 4, .7); } 100% { box-shadow: 0 0 28px 6px rgba(202, 138, 4, 0); } }
@keyframes spark { from { transform: rotate(var(--a)) translateX(0) scale(1); opacity: 1; } to { transform: rotate(var(--a)) translateX(var(--d)) scale(.2); opacity: 0; } }
@keyframes grow-x { from { transform: scaleX(0); } to { transform: none; } }
@keyframes grow-y { from { transform: scaleY(0); } to { transform: none; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
</style>
<div id="root">
  <div class="app"><header class="top"><h1 class="brand">Meal Planner</h1></header><main class="main"><p class="muted">Loading your kitchen…</p></main></div>
</div>
